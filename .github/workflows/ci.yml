name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: ci-placeholder-secret-not-used-in-production-0000
      DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_market_test?schema=public
      DATABASE_URL_UNPOOLED: postgresql://campus:campus@localhost:5432/campus_market_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations to the isolated test database
        run: pnpm db:deploy

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Start application against the isolated test database
        run: |
          pnpm start &
          npx wait-on http://localhost:3000/api/health -t 120000

      - name: Integration tests
        run: pnpm test:integration
        env:
          TEST_BASE_URL: http://localhost:3000
          TEST_DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_market_test?schema=public

      - name: Dependency audit
        run: pnpm audit --audit-level high

  e2e:
    name: Playwright journeys
    runs-on: ubuntu-latest
    needs: quality

    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_market_test?schema=public

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus
          POSTGRES_DB: campus_market_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build application
        run: pnpm build
      - name: Run Playwright journeys
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://campus:campus@localhost:5432/campus_market_e2e?schema=public
